<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title>Notas</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="imagens/logoNotas.png">
    <script src="js/app.js"></script>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div><h1> Cabeçalho </h1></div>
        <div id="divBusca">
          <input type="text" id="txtBusca" placeholder="Buscar nota..."/>
          <img src="imagens/lupa.png" id="btnBusca" alt="Buscar"/>
        </div>
      <div class="menu" id="menu">
        <div id="novaNota"><button id="criarNota"> Nova Nota   +</button></div>
        <div id="abas">
          <div class="aba"><h2>Notas</h2></div>
          <div class="aba"><h2>Favoritas</h2></div>
          <div class="aba"><h2>Lembretes</h2></div>
          <div class="aba"><h2>Arquivadas</h2></div>
          <div class="aba"><h2>Lixeira</h2></div>
        </div>
        <div id="Etiquetas">
          <div><button id="criarEtiqueta">Etiquetas +</button></div>
          <div class="etiqueta" id="etiqueta_trabalho"><h2>Trabalho</h2></div>
          <div class="etiqueta" id="etiqueta_estudos"><h2>Estudos</h2></div>
          <div class="etiqueta" id="etiqueta_ideias"><h2>Ideias</h2></div>
          <div class="etiqueta" id="etiqueta_projetos"><h2>Projetos</h2></div>
          <div class="etiqueta" id="etiqueta_pessoal"><h2>Pessoal</h2></div>
        </div>
      </div>
      <div class="content">
        <h3>Minhas Notas</h3>
      </div>
      <div class="footer"><h4>Rodapé</h4></div>
    </div>

  </body
