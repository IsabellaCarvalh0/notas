<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title>Notas</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="imagens/logoNotas.png">
    <script src="js/app.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> <!--adiciona os ícones das etiquetas-->
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div><h1> Cabeçalho </h1></div>
        <div id="divBusca">
          <input type="text" id="txtBusca" placeholder="Buscar nota..."/>
          <img src="imagens/lupa.png" id="btnBusca" alt="Buscar"/>
        </div>
      </div>

      <div class="menu" id="menu"> <!--parte do sidebar-->
        <div id="topoSidebar">
          <div id="logoSidebar">
            <img src="imagens/logoNotas.png" alt="Logo Neo Keep">
          </div>

          <button id="botaoMenu">
            <i class="fa-solid fa-bars"></i> <!--ícone botão-->
          </button>
        </div>

        <div id="novaNota"><button id="criarNota"> Nova Nota   +</button></div>
        <div id="abas">
          <div class="aba">
            <i class="fa-solid fa-note-sticky"></i>
            <h2>Notas</h2>
          </div>

          <div class="aba">
            <i class="fa-solid fa-star"></i>
            <h2>Favoritas</h2>
          </div>

          <div class="aba">
            <i class="fa-solid fa-box-archive"></i>
            <h2>Arquivadas</h2>
          </div>

          <div class="aba">
            <i class="fa-solid fa-trash"></i>
            <h2>Lixeira</h2>
          </div>
          
        </div>
        <div id="Etiquetas">
          <button id="criarEtiqueta">
            <span>Etiquetas</span>
            <span>+</span>
          </button>

          <div class="etiqueta">
              <span class="bolinha trabalho"></span>
              <h2>Trabalho</h2>
              <span class="contador">6</span>
          </div>

          <div class="etiqueta">
              <span class="bolinha estudos"></span>
              <h2>Estudos</h2>
              <span class="contador">3</span>
          </div>

          <div class="etiqueta">
              <span class="bolinha ideias"></span>
              <h2>Ideias</h2>
              <span class="contador">2</span>
          </div>

          <div class="etiqueta">
              <span class="bolinha projetos"></span>
              <h2>Projetos</h2>
              <span class="contador">1</span>
          </div>

          <div class="etiqueta">
              <span class="bolinha pessoal"></span>
              <h2>Pessoal</h2>
              <span class="contador">5</span>

          </div>
        </div>
      </div>
      <div class="content">
        <h3>Minhas Notas</h3>
      </div>
      <div class="footer"><h4>Rodapé</h4></div>
    </div>

  <script src="js/sidebar.js"></script>
  </body>
</html>
